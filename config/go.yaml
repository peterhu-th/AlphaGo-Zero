env_params:
  board_size: 9
  action_size: 82
  in_channels: 9

mcts_params:
  num_simulations: 200
  c_puct: 1.5
  dirichlet_epsilon: 0.25
  dirichlet_alpha: 0.13
  temperature_threshold: 30

network_params:
  num_residual_blocks: 10
  num_channels: 128

train_params:
  batch_size: 256
  learning_rate: 0.002
  num_epochs: 5
  eval_win_rate_threshold: 0.55
  replay_buffer_size: 100000
  momentum: 0.9
  weight_decay: 0.0001
  initial_population: 300
  num_iterations: 100
  num_eval_games: 10
