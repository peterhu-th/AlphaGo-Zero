env_params:
  board_size: 15
  action_size: 225
  in_channels: 4

mcts_params:
  num_simulations: 1600
  c_puct: 2.0
  dirichlet_epsilon: 0.25
  dirichlet_alpha: 0.04
  temperature_threshold: 10
  virtual_loss_batch_size: 8
  virtual_loss: 3.0

network_params:
  num_residual_blocks: 10
  num_channels: 128

train_params:
  batch_size: 256
  learning_rate: 0.001
  num_epochs: 5
  eval_win_rate_threshold: 0.55
  replay_buffer_size: 100000
  momentum: 0.9
  weight_decay: 0.0001
  initial_population: 1000
  num_iterations: 50
  num_games_per_iteration: 40
  num_eval_games: 20